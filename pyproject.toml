[project]
name = "oracle-mcp"
version = "0.1.0"
description = "Read-only Oracle MCP server that auto-discovers connections from DBeaver and SQL Developer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3.0",
    "py-key-value-aio>=0.2.0",
    "oracledb>=2.5.0",
    "psycopg[binary]>=3.1.0",
    "sqlglot>=25.0.0",
    "keyring>=25.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
oracle-mcp = "oracle_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oracle_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
